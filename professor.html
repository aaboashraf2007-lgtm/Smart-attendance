<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الدكتور - إدارة الحضور</title>
    <!-- مكتبة توليد الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .timer-box {
            font-size: 1.1rem;
            color: #eab308;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .students-section {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
            max-height: 150px;
            overflow-y: auto;
        }
        .students-section h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        #studentsList {
            list-style-type: none;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        #studentsList li {
            padding: 4px 0;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>👨‍🏫 قاعة المحاضرات - الدكتور</h1>
        <p class="subtitle">مادة: هندسة البرمجيات (الفرقة الثانية)</p>

        <!-- مكان ظهور الباركود -->
        <div id="qrcode"></div>

        <div class="timer-box">
            تحديث كود الحضور خلال: <span id="timer">60</span> ثانية
        </div>

        <div class="students-section">
            <h3>الطلاب الحاضرون الآن:</h3>
            <ul id="studentsList">
                <li>في انتظار تسجيل الطلاب...</li>
            </ul>
        </div>
    </div>

    <script>
        let timeLeft = 60;

        function generateQRCode() {
            const randomToken = "ATTENDANCE_TOKEN_" + Math.random().toString(36).substring(2) + "_" + Date.now();
            const studentUrl = window.location.href.replace("professor.html", "student.html") + "?token=" + randomToken;

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function startTimer() {
            setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    timeLeft = 60;
                    generateQRCode();
                }
            }, 1000);
        }

        generateQRCode();
        startTimer();
    </script>
</body>
</html>
