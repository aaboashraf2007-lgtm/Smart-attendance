<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحضير الذكي - Smart Attendance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #ffffff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 420px; width: 100%; border: 1px solid rgba(255,255,255,0.05); }
        h1 { margin-bottom: 10px; font-size: 24px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        .btn { display: block; width: 100%; padding: 14px; margin-bottom: 15px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: background 0.3s; }
        .btn:hover { background: #4f46e5; }
        .btn-student { background: #10b981; }
        .btn-student:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <h1> نظام التحضير الذكي</h1>
        <p>اختر واجهة الدخول لبدء الجلسة أو تسجيل الحضور</p>

        <!-- زر واجهة الدكتور -->
        <a href="professor.html" class="btn">👨‍🏫 دخول الدكتور (إنشاء جلسة)</a>

        <!-- زر واجهة الطالب -->
        <a href="student.html" class="btn btn-student">🎓 تسجيل حضور (طالب)</a>
    </div>

</body>
</html>
